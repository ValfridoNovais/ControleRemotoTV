name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    # O projeto Android (gradlew, app/, etc.) fica em MMPG_Remote/, não na
    # raiz do repositório — sem isso todo "run:" abaixo executaria no lugar
    # errado (era exatamente esse o bug que impedia o GitHub de sequer
    # reconhecer este arquivo como workflow, antes de mover pra .github/
    # na raiz).
    defaults:
      run:
        working-directory: MMPG_Remote
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Run unit tests
        working-directory: MMPG_Remote
        run: gradle --no-daemon test

      - name: Build debug APK
        working-directory: MMPG_Remote
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MMPG-Remote-debug
          path: MMPG_Remote/app/build/outputs/apk/debug/*.apk

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MMPG-Remote-test-reports
          path: MMPG_Remote/app/build/reports/tests/
